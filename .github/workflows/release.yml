name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches plugin version
        run: test "$(node -p "require('./manifest.json').version")" = "${GITHUB_REF_NAME}"

      - name: Run checks
        run: npm run check

      - name: Package plugin
        run: npm run package

      - name: Attest main.js provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/main.js

      - name: Attest styles.css provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/styles.css

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/main.js
          dist/manifest.json
          dist/styles.css
          --verify-tag
          --generate-notes
          --title "Linear Solver ${GITHUB_REF_NAME}"
